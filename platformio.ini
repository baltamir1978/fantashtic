; Fantashtic - firmware LoRa privado para M5Stack Cardputer Adv + Cap LoRa-1262
;
; El historial de chat vive en la microSD, no en flash interna, asi que la
; particion nvs por defecto (20 KB) es suficiente para las claves de config.

[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform  = espressif32@6.12.0
board     = m5stack-stamps3          ; Stamp-S3A: ESP32-S3FN8, 8 MB flash, SIN PSRAM
framework = arduino

board_build.partitions = default_8MB.csv

upload_protocol = esptool
upload_speed    = 1500000
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=3
  -std=gnu++17
build_unflags = -std=gnu++11

lib_deps =
  jgromes/RadioLib@7.3.0
  m5stack/M5Unified@^0.2.8
  ; M5Cardputer >= 1.1.0 es OBLIGATORIO: el soporte del Cardputer Adv
  ; (board_M5CardputerADV y el lector de teclado TCA8418) no existe antes.
  ; Con 1.0.x compila pero el teclado esta muerto. Arrastra IRremote.
  m5stack/M5Cardputer@^1.1.1
  mikalhart/TinyGPSPlus@^1.1.0       ; no existe m5stack/TinyGPSPlus en el registro
  adafruit/Adafruit NeoPixel@^1.12.0 ; M5Unified no gestiona el WS2812
; NO añadir nanopb: los protobufs se serializan a mano en src/proto/messages.cpp
; y la cripto en src/proto/{aes,kdf}.cpp, para que el mismo codigo corra en el
; ESP32 y en los tests del ordenador. Declararlo obligaba a PlatformIO a instalar
; protobuf + grpcio-tools y a ejecutar un paso de generacion en cada compilacion,
; todo para un runtime que ningun fuente incluye.

; Tests de protocolo en el host, sin hardware.
; build_src_filter deja fuera main.cpp, hal/ y radio/, que dependen de Arduino:
; en el ordenador solo se compila src/proto (y mas adelante src/mesh).
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<proto/*> +<mesh/*> +<util/*>
build_flags =
  -std=gnu++17
  -Wall
  -I include
  -I src
  -I test/test_proto
  -DFT_HOST_BUILD=1
